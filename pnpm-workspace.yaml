# pnpm-workspace.yaml — pnpm 11 supply-chain hardening
#
# This file is the SINGLE SOURCE OF TRUTH for build-script approvals and
# supply-chain controls. pnpm 11 no longer reads the "pnpm" field from
# package.json — all settings must live here.

packages:
  - '.'

# Block transitive (sub-)dependencies from resolving via non-registry
# protocols (git:, github:, file:, link:, tarball URLs). Direct deps may
# still use them; this closes a common transitive supply-chain vector.
blockExoticSubdeps: true

# Turn an unapproved build script into a hard install failure instead of a
# silent skip, so CI catches any new build-script dependency before prod.
strictDepBuilds: true

# Refuse to install package versions published less than 24h ago (minutes),
# mitigating account-compromise "zero-day" poisoning of popular packages.
minimumReleaseAge: 1440

# Build-script allowlist (pnpm 11 format: allowBuilds replaces onlyBuiltDependencies)
#
# To add a new package that requires build scripts:
#   1. Verify the package is trusted and the script is necessary (run `pnpm why <pkg>`)
#   2. Add it here with `true` and a comment explaining why
#   3. Commit with a brief justification
allowBuilds: { '@tailwindcss/oxide': true, esbuild: true }

# Pin known-vulnerable transitive packages until direct deps release a fix.
# Using ^8.5.10 (not >=) to stay on the known-safe 8.x line and avoid
# admitting future 9.x+ releases that may carry new vulnerabilities.
overrides:
  postcss: '^8.5.10'
