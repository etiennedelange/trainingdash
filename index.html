<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e13" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="A personal dashboard mirroring your Strava activity with near-instant live updates, streaks, and progress tracking." />
    <!-- Single-athlete personal tool (see PRODUCT.md) — not meant to be indexed. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Trainingdash" />
    <meta property="og:description" content="A personal dashboard mirroring your Strava activity with near-instant live updates, streaks, and progress tracking." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Trainingdash" />
    <meta name="twitter:description" content="A personal dashboard mirroring your Strava activity with near-instant live updates, streaks, and progress tracking." />
    <meta name="twitter:image" content="/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("trainingdash-theme");
          if (stored === "light") document.documentElement.dataset.theme = "light";
        } catch (e) {}
      })();
    </script>
    <title>Trainingdash</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
